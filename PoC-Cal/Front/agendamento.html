<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento Barbearia</title>
  <link rel="stylesheet" href="style.css">
  <!-- Cal.com Embed SDK -->
  <script type="text/javascript">
    (function (C, A, L) {
      let p = function (a, ar) { a.q.push(ar); };
      let d = C.document;
      C.Cal = C.Cal || function () {
        let cal = C.Cal;
        let ar = arguments;
        if (!cal.loaded) {
          cal.ns = {};
          cal.q = cal.q || [];
          d.head.appendChild(d.createElement("script")).src = A;
          cal.loaded = true;
        }
        if (ar[0] === L) {
          const api = function () { p(api, arguments); };
          const namespace = ar[1];
          api.q = api.q || [];
          if (typeof namespace === "string") {
            cal.ns[namespace] = cal.ns[namespace] || api;
            p(cal.ns[namespace], ar);
            p(cal, ["initNamespace", namespace]);
          } else p(cal, ar);
          return;
        }
        p(cal, ar);
      };
    })(window, "https://app.cal.com/embed/embed.js", "init");

    Cal("init", { origin: "https://cal.com" });
  </script>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <button class="btn-home">Página Inicial</button>
    <div class="user-area">
      <span class="user-name">Nome do usuário</span>
      <div class="user-avatar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="main">

    <!-- ESCOLHA O BARBEIRO -->
    <section class="section-barbeiro">
      <h2 class="section-title">Escolha o Barbeiro</h2>
      <div class="barbeiros-list">

        <!-- Sem Preferência -->
        <label class="barbeiro-card" data-id="0">
          <div class="barbeiro-info">
            <div class="barbeiro-avatar placeholder-avatar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
              </svg>
            </div>
            <span class="barbeiro-nome">Sem Preferência</span>
          </div>
          <input type="radio" name="barbeiro" value="0" checked>
          <span class="radio-custom"></span>
        </label>

        <!-- Caio Mesa -->
        <div class="barbeiro-group">
          <label class="barbeiro-card" data-id="1">
            <div class="barbeiro-info">
              <div class="barbeiro-avatar">
                <img src="https://ui-avatars.com/api/?name=Caio+Mesa&background=4a3f2f&color=fff&size=40" alt="Caio Mesa">
              </div>
              <span class="barbeiro-nome">Caio Mesa</span>
            </div>
            <input type="radio" name="barbeiro" value="1">
            <span class="radio-custom"></span>
          </label>
          <button class="btn-portfolio">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
            </svg>
            portfolio
          </button>
        </div>

        <!-- João Franco -->
        <div class="barbeiro-group">
          <label class="barbeiro-card" data-id="2">
            <div class="barbeiro-info">
              <div class="barbeiro-avatar">
                <img src="https://ui-avatars.com/api/?name=Joao+Franco&background=2f3f4a&color=fff&size=40" alt="João Franco">
              </div>
              <span class="barbeiro-nome">João Franco</span>
            </div>
            <input type="radio" name="barbeiro" value="2">
            <span class="radio-custom"></span>
          </label>
          <button class="btn-portfolio">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
            </svg>
            portfolio
          </button>
        </div>

      </div>
    </section>

    <!-- CONTEÚDO CENTRAL -->
    <div class="content-grid">

      <!-- COLUNA ESQUERDA: Serviços + Cal.com inline -->
      <div class="col-left">

        <!-- PAINEL: Serviços à esquerda, Cal.com à direita -->
        <div class="panel-main">

          <!-- Serviços -->
          <div class="servicos-col">
            <h3 class="panel-title">Serviços</h3>
            <p class="panel-subtitle">Opcional com pacote ativo</p>

            <div class="servicos-list">
              <label class="servico-item">
                <div class="servico-info">
                  <span class="servico-nome">Corte Fade (Degradê)</span>
                  <span class="servico-meta">40min</span>
                </div>
                <span class="servico-preco">R$ 35,00</span>
                <input type="radio" name="servico" value="1">
                <span class="radio-custom"></span>
              </label>

              <label class="servico-item">
                <div class="servico-info">
                  <span class="servico-nome">Cabelo + Barba</span>
                  <span class="servico-meta">1h</span>
                </div>
                <span class="servico-preco">R$ 55,00</span>
                <input type="radio" name="servico" value="2">
                <span class="radio-custom"></span>
              </label>

              <label class="servico-item">
                <div class="servico-info">
                  <span class="servico-nome">Barba</span>
                  <span class="servico-meta">30min</span>
                </div>
                <span class="servico-preco">R$ 25,00</span>
                <input type="radio" name="servico" value="3">
                <span class="radio-custom"></span>
              </label>

              <label class="servico-item">
                <div class="servico-info">
                  <span class="servico-nome">Careca</span>
                  <span class="servico-meta">30min</span>
                </div>
                <span class="servico-preco">R$ 20,00</span>
                <input type="radio" name="servico" value="4">
                <span class="radio-custom"></span>
              </label>

              <label class="servico-item">
                <div class="servico-info">
                  <span class="servico-nome">Careca + Barba</span>
                  <span class="servico-meta">1h</span>
                </div>
                <span class="servico-preco">R$ 40,00</span>
                <input type="radio" name="servico" value="5">
                <span class="radio-custom"></span>
              </label>

              <label class="servico-item">
                <div class="servico-info">
                  <span class="servico-nome">Limpeza de Sobrancelha</span>
                  <span class="servico-meta">5min</span>
                </div>
                <span class="servico-preco">R$ 5,00</span>
                <input type="radio" name="servico" value="6">
                <span class="radio-custom"></span>
              </label>
            </div>
          </div>

          <!-- Divisor vertical -->
          <div class="panel-divider"></div>

          <!-- Cal.com Embed inline -->
          <div class="calendario-col cal-embed-col">
            <h3 class="panel-title">Calendário &amp; Horários</h3>
            <div id="cal-embed-container">
              <!-- O Cal.com será montado aqui via SDK -->
              <div id="cal-inline-placeholder">
                <div class="cal-loading">
                  <div class="cal-loading-spinner"></div>
                  <span>Carregando calendário…</span>
                </div>
              </div>
            </div>
          </div>

        </div>

      </div>

      <!-- COLUNA DIREITA: Pacote + Obs -->
      <div class="col-right">

        <!-- Pacote Ativo -->
        <div class="panel-pacote">
          <div class="pacote-header">
            <span class="pacote-label">Pacote Ativo</span>
          </div>
          <div class="pacote-card">
            <div class="pacote-card-title">4 Cortes</div>
            <div class="pacote-card-sub">Pacote com 4 cortes</div>
            <div class="pacote-progress-bar">
              <div class="pacote-progress-fill"></div>
            </div>
            <div class="pacote-progress-label">4/4</div>
            <div class="pacote-economia">Economize R$ 20</div>
          </div>
        </div>

        <!-- Observações -->
        <div class="panel-obs">
          <label class="obs-label">Observações (Opcional)</label>
          <textarea class="obs-textarea" placeholder="Ex: Prefiro corte mais baixo..."></textarea>
        </div>

        <!-- Usando pacote ativo -->
        <div class="pacote-ativo-badge">
          <span class="check-icon">✓</span>
          <span>Usando pacote ativo</span>
        </div>

        <!-- Info: confirmação pelo Cal.com -->
        <div class="cal-confirm-hint">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/>
          </svg>
          Selecione data e horário no calendário ao lado para confirmar o agendamento.
        </div>

      </div>
    </div>

  </main>

  <script src="agendamento.js"></script>
</body>
</html>
